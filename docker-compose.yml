# Bot de trading algoritmico — cinco estrategias en paralelo
#
# Freqtrade corre UNA estrategia por proceso. Para operar cinco a la vez hacen
# falta cinco contenedores, cada uno con su base de datos, su puerto y su
# cartera simulada. No es un capricho de diseno: es como funciona la
# herramienta, y ademas es lo correcto — cada estrategia se mide por separado y
# el fallo de una no arrastra a las demas.
#
# Uso:
#   docker compose run --rm baseline --version   # verificar instalacion
#   docker compose up -d                         # levantar las cinco + vigilante
#   docker compose logs -f orochi                # seguir una
#   docker compose ps                            # estado de todas
#   docker compose down                          # detener
#
# AVISO SOBRE DINERO REAL
# -----------------------
# En dry-run cada bot tiene su propia cartera simulada de 1.000 USDT, asi que
# las cinco son comparables entre si y ninguna interfiere con otra.
#
# En LIVE eso NO se cumple: los cinco compartirian una sola cuenta de Binance.
# Cinco bots x 3 posiciones x 0.5 % de riesgo = hasta 7.5 % de la cuenta
# expuesto a la vez, cuando la regla del plan dice 1.5 %. Antes de tocar dinero
# real hay que repartir el capital entre los bots (dry_run_wallet / N) o correr
# uno solo. Ver docs/STRATEGY.md.

services:
  # ---------------------------------------------------------------------------
  # Inicializacion del volumen de la base de datos.
  #
  # Docker crea los volumenes nombrados con dueño root cuando la ruta de montaje
  # no existe en la imagen. Freqtrade corre como ftuser (uid 1000), asi que sin
  # este paso los bots arrancan y mueren con
  # "sqlite3.OperationalError: unable to open database file".
  # ---------------------------------------------------------------------------
  db-init:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-db-init
    user: root
    volumes:
      - "db:/freqtrade/db"
    entrypoint: ["sh", "-c", "mkdir -p /freqtrade/db && chown -R 1000:1000 /freqtrade/db"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # baseline — BaselineTrend
  # ---------------------------------------------------------------------------
  baseline:
    image: freqtradeorg/freqtrade:stable
    container_name: ft-baseline
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - "./user_data:/freqtrade/user_data"
      # La base de datos NO va en el bind mount de macOS: al suspenderse el
      # equipo, los descriptores de archivo quedan invalidos y SQLite empieza a
      # dar "disk I/O error" hasta reiniciar. Un volumen nombrado vive en el
      # ext4 de la VM, donde los bloqueos sobreviven a la suspension.
      - "db:/freqtrade/db"
    ports:
      # Solo loopback. Nunca abrir a internet sin reverse proxy con TLS.
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      - FREQTRADE__EXCHANGE__KEY=${BINANCE_API_KEY:-}
      - FREQTRADE__EXCHANGE__SECRET=${BINANCE_API_SECRET:-}
      - FREQTRADE__TELEGRAM__TOKEN=${TELEGRAM_TOKEN:-}
      - FREQTRADE__TELEGRAM__CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - FREQTRADE__BOT_NAME=baseline
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ping', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: >
      trade
      --logfile /freqtrade/user_data/logs/baseline.log
      --db-url sqlite:////freqtrade/db/baseline.sqlite
      --config /freqtrade/user_data/config.dryrun.json
      --strategy BaselineTrendRapida

  # ---------------------------------------------------------------------------
  # orochi — Orochi
  # ---------------------------------------------------------------------------
  orochi:
    image: freqtradeorg/freqtrade:stable
    container_name: ft-orochi
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - "./user_data:/freqtrade/user_data"
      # La base de datos NO va en el bind mount de macOS: al suspenderse el
      # equipo, los descriptores de archivo quedan invalidos y SQLite empieza a
      # dar "disk I/O error" hasta reiniciar. Un volumen nombrado vive en el
      # ext4 de la VM, donde los bloqueos sobreviven a la suspension.
      - "db:/freqtrade/db"
    ports:
      # Solo loopback. Nunca abrir a internet sin reverse proxy con TLS.
      - "127.0.0.1:8081:8080"
    env_file:
      - .env
    environment:
      - FREQTRADE__EXCHANGE__KEY=${BINANCE_API_KEY:-}
      - FREQTRADE__EXCHANGE__SECRET=${BINANCE_API_SECRET:-}
      - FREQTRADE__TELEGRAM__TOKEN=${TELEGRAM_TOKEN:-}
      - FREQTRADE__TELEGRAM__CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - FREQTRADE__BOT_NAME=orochi
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ping', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: >
      trade
      --logfile /freqtrade/user_data/logs/orochi.log
      --db-url sqlite:////freqtrade/db/orochi.sqlite
      --config /freqtrade/user_data/config.dryrun.json
      --strategy OrochiRapida

  # ---------------------------------------------------------------------------
  # reversion — ReversionRSI
  # ---------------------------------------------------------------------------
  reversion:
    image: freqtradeorg/freqtrade:stable
    container_name: ft-reversion
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - "./user_data:/freqtrade/user_data"
      # La base de datos NO va en el bind mount de macOS: al suspenderse el
      # equipo, los descriptores de archivo quedan invalidos y SQLite empieza a
      # dar "disk I/O error" hasta reiniciar. Un volumen nombrado vive en el
      # ext4 de la VM, donde los bloqueos sobreviven a la suspension.
      - "db:/freqtrade/db"
    ports:
      # Solo loopback. Nunca abrir a internet sin reverse proxy con TLS.
      - "127.0.0.1:8082:8080"
    env_file:
      - .env
    environment:
      - FREQTRADE__EXCHANGE__KEY=${BINANCE_API_KEY:-}
      - FREQTRADE__EXCHANGE__SECRET=${BINANCE_API_SECRET:-}
      - FREQTRADE__TELEGRAM__TOKEN=${TELEGRAM_TOKEN:-}
      - FREQTRADE__TELEGRAM__CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - FREQTRADE__BOT_NAME=reversion
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ping', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: >
      trade
      --logfile /freqtrade/user_data/logs/reversion.log
      --db-url sqlite:////freqtrade/db/reversion.sqlite
      --config /freqtrade/user_data/config.dryrun.json
      --strategy ReversionRSIRapida

