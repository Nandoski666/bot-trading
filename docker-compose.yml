  # ---------------------------------------------------------------------------
  # Vigilante: heartbeat, limite diario, kill switch y resumen diario.
  #
  # UNO para los cinco, no cinco vigilantes. Asi el resumen diario llega en un
  # solo mensaje comparando las estrategias, que es la informacion util cuando
  # corren a la vez. Cada bot mantiene su contabilidad separada dentro del
  # estado del vigilante: el drawdown de uno no bloquea a los demas.
  #
  # Corre en su propio contenedor a proposito: la mitad de lo que vigila son
  # cosas que ocurren cuando un bot deja de funcionar.
  # ---------------------------------------------------------------------------
  watchdog:
    image: freqtradeorg/freqtrade:stable
    container_name: ft-watchdog
    restart: unless-stopped
    depends_on:
      baseline:
        condition: service_healthy
      orochi:
        condition: service_healthy
      reversion:
        condition: service_healthy
      ruptura:
        condition: service_healthy
      momentum:
        condition: service_healthy
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./tools:/freqtrade/tools:ro"
      - "./.env:/freqtrade/.env:ro"
      - "db:/freqtrade/db"
    env_file:
      - .env
    environment:
      # Sin esto Python bufferiza stdout al no haber TTY y `docker compose logs
      # watchdog` sale vacio durante horas.
      - PYTHONUNBUFFERED=1
    entrypoint: ["python", "-u"]
    command:
      - "/freqtrade/tools/watchdog.py"
      - "--intervalo"
      - "300"
      - "--url"
      - "baseline=http://baseline:8080"
      - "--url"
      - "orochi=http://orochi:8080"
      - "--url"
      - "reversion=http://reversion:8080"
      - "--url"
      - "ruptura=http://ruptura:8080"
      - "--url"
      - "momentum=http://momentum:8080"

  # ---------------------------------------------------------------------------
  # Filtro de contexto con IA.
  #
  # Evalua cada hora si hay alguna razon de CONTEXTO para dejar de abrir
  # posiciones, y escribe su veredicto en user_data/decision_ia.json. Las
  # estrategias lo leen antes de confirmar una entrada.
  #
  # Solo puede RESTAR operaciones, nunca provocarlas, y se ignora por completo
  # en backtest — si afectara al backtest, ningun resultado historico volveria a
  # ser reproducible.
  #
  # Funciona con Anthropic (de pago) o con Groq (gratis): elige segun que clave
  # haya en .env. Sin ninguna de las dos no bloquea nada — falla abierto.
  # ---------------------------------------------------------------------------
  filtro-ia:
    image: freqtradeorg/freqtrade:stable
    container_name: ft-filtro-ia
    restart: unless-stopped
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./tools:/freqtrade/tools:ro"
      - "./.env:/freqtrade/.env:ro"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    entrypoint: ["sh", "-c"]
    command:
      - "pip install --quiet --no-warn-script-location anthropic groq pydantic >/dev/null 2>&1;
         exec python -u /freqtrade/tools/filtro_ia.py --intervalo 3600"


# ---------------------------------------------------------------------------
# Volumenes nombrados
# ---------------------------------------------------------------------------
volumes:
  # Estado de los cinco bots (SQLite). Sobrevive a `docker compose down`; para
  # borrarlo de verdad hace falta `docker compose down -v`, que es justo la
  # friccion que se quiere.
  db:
