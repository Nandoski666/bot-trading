# Bot de trading algorítmico — entorno reproducible
#
# Uso:
#   docker compose run --rm freqtrade --version        # verificar instalación
#   docker compose up -d                               # levantar el bot (dry-run)
#   docker compose logs -f                             # ver logs
#   docker compose down                                # detener
#
# Las credenciales NUNCA van en este archivo: se leen de .env (que está en .gitignore).

services:
  # ---------------------------------------------------------------------------
  # Inicializacion del volumen de la base de datos.
  #
  # Docker crea los volumenes nombrados con dueño root cuando la ruta de montaje
  # no existe en la imagen. Freqtrade corre como ftuser (uid 1000), asi que sin
  # este paso el bot arranca y muere con
  # "sqlite3.OperationalError: unable to open database file".
  #
  # Corre una vez, ajusta el dueño y termina. Los demas servicios esperan a que
  # acabe con `service_completed_successfully`.
  # ---------------------------------------------------------------------------
  db-init:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-db-init
    user: root
    volumes:
      - "db:/freqtrade/db"
    entrypoint: ["sh", "-c", "mkdir -p /freqtrade/db && chown -R 1000:1000 /freqtrade/db"]
    restart: "no"

  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    # Persistencia: todo el estado vive en user_data/ del host, así sobrevive
    # a reinicios, recreaciones del contenedor y actualizaciones de imagen.
    volumes:
      - "./user_data:/freqtrade/user_data"
      # La base de datos NO va en el bind mount de macOS.
      #
      # Docker Desktop expone ./user_data a traves de un sistema de archivos
      # virtualizado. SQLite mantiene el archivo abierto durante toda la vida
      # del proceso y depende de bloqueos POSIX; cuando el Mac se suspende, esos
      # descriptores quedan invalidos y el bot empieza a dar
      # "sqlite3.OperationalError: disk I/O error" en cada consulta, hasta
      # reiniciar. El archivo no se corrompe — integrity_check sigue diciendo ok
      # — pero el proceso ya no puede escribir. Con una posicion abierta, eso es
      # un bot que no puede registrar lo que hace.
      #
      # Un volumen nombrado vive en el ext4 de la maquina virtual de Docker,
      # donde los bloqueos funcionan como es debido y sobreviven a la suspension.
      # Para leerlo desde el host: python tools/exportar_db.py
      - "db:/freqtrade/db"
    ports:
      # FreqUI + API REST. Se expone solo en loopback: nunca abrir a internet
      # sin un reverse proxy con TLS y autenticación.
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # Freqtrade mapea variables FREQTRADE__<seccion>__<clave> sobre el JSON.
      # Esto permite inyectar secretos sin escribirlos en config.*.json.
      - FREQTRADE__EXCHANGE__KEY=${BINANCE_API_KEY:-}
      - FREQTRADE__EXCHANGE__SECRET=${BINANCE_API_SECRET:-}
      - FREQTRADE__TELEGRAM__TOKEN=${TELEGRAM_TOKEN:-}
      - FREQTRADE__TELEGRAM__CHAT_ID=${TELEGRAM_CHAT_ID:-}
    # El vigilante espera a que esto pase a "healthy" antes de arrancar. Sin
    # ello ambos contenedores arrancan a la vez, el vigilante pregunta antes de
    # que la API este escuchando, y manda una falsa alarma de "bot caido" en
    # cada reinicio. Una alerta que salta sin motivo se acaba ignorando.
    # /api/v1/ping no pide autenticacion, asi que sirve sin credenciales.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ping', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Comando por defecto: dry-run. Para live hay que cambiar el config
    # explícitamente — nunca por accidente.
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/db/tradesv3.dryrun.sqlite
      --config /freqtrade/user_data/config.dryrun.json
      --strategy BaselineTrend

  # ---------------------------------------------------------------------------
  # Vigilante (T9): heartbeat, limite de perdida diaria, kill switch por
  # drawdown y resumen diario por Telegram.
  #
  # Corre en un contenedor APARTE del bot, a proposito. La mitad de lo que tiene
  # que vigilar son cosas que ocurren cuando el bot deja de funcionar: si
  # viviera dentro del mismo proceso, el caso mas importante —que el bot muera—
  # seria justo el que no podria detectar.
  # ---------------------------------------------------------------------------
  watchdog:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-watchdog
    restart: unless-stopped
    depends_on:
      freqtrade:
        condition: service_healthy
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./tools:/freqtrade/tools:ro"
      - "db:/freqtrade/db"
      - "./.env:/freqtrade/.env:ro"
    env_file:
      - .env
    environment:
      # El vigilante habla con el bot por la red interna de Compose, no por
      # localhost: cada contenedor tiene el suyo.
      - FREQTRADE_API_URL=http://freqtrade:8080
      # Sin esto Python bufferiza stdout al no haber TTY, y `docker compose logs
      # watchdog` sale vacio durante horas. Un vigilante cuyos logs no se ven no
      # se puede auditar — y auditarlo es justo lo que se hace cuando algo va mal.
      - PYTHONUNBUFFERED=1
    entrypoint: ["python", "-u"]
    command:
      - "/freqtrade/tools/watchdog.py"
      - "--url"
      - "http://freqtrade:8080"
      - "--intervalo"
      - "300"

# ---------------------------------------------------------------------------
# Volumenes nombrados
# ---------------------------------------------------------------------------
volumes:
  # Estado del bot (SQLite). Fuera del bind mount a proposito — ver el
  # comentario en el servicio freqtrade.
  #
  # Sobrevive a `docker compose down` y a las actualizaciones de imagen. Para
  # borrarlo de verdad hace falta `docker compose down -v`, que es justo la
  # friccion que se quiere: perder este volumen es perder el historial de
  # operaciones del dry-run.
  db:
